name: CI

# Pushes to main are covered by deploy.yml, which runs these same checks
# before deploying; this workflow covers PRs (rare, but web sessions and the
# CMS can open them) and manual runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type + content check
        run: npm run check
      - name: Alt-text check
        run: node scripts/check-alt-text.mjs
      - name: Hook contract tests
        run: bash scripts/agent-hooks/test-hooks.sh
      - name: Build (apex config, matches deploy)
        run: npm run build
        env:
          USE_CUSTOM_DOMAIN: 'true'
      - name: Calendar feed contract
        run: node scripts/check-calendar-feed.mjs
      - name: Structured-data contract
        run: node scripts/check-structured-data.mjs
