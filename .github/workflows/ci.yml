name: CI

# Pushes to main are covered by deploy.yml, which runs these same checks
# before deploying; this workflow covers PRs (rare, but web sessions and the
# CMS can open them) and manual runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm run bootstrap
      - name: Install test browser
        # The runner image preconfigures Google's Chrome apt source, and
        # --with-deps runs apt-get update, which fails whenever that source is
        # mid-publish (Hash Sum mismatch, 2026-09-09). Playwright's Chromium
        # does not need it, so drop it before installing.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run verify
